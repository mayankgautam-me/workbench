"$schema" = 'https://starship.rs/config-schema.json'

# Minimal look, detailed content: plain coloured text, no backgrounds or boxes.
# Left:  where you are + git state.   Right: exit code, duration, jobs, runtimes, time.
add_newline = true
command_timeout = 1000
palette = "tokyonight"

format = """
$username$hostname$directory$git_branch$git_commit$git_state$git_status\
$fill\
$status$cmd_duration$jobs$nodejs$python$rust$golang$docker_context$time
$character"""

[palettes.tokyonight]
muted = "#565f89"
subtle = "#737aa2"
fg = "#c0caf5"
blue = "#7aa2f7"
cyan = "#7dcfff"
purple = "#bb9af7"
green = "#9ece6a"
yellow = "#e0af68"
orange = "#ff9e64"
red = "#f7768e"

# --- Left ------------------------------------------------------------------
[username]                       # only shown over SSH or as root
format = "[$user]($style)[@](muted)"
style_user = "subtle"
style_root = "bold red"

[hostname]
format = "[$hostname]($style) "
style = "subtle"

[directory]                      # in a repo: starts at the repo root (bold); elsewhere: parents shortened
format = "[$path]($style)[$read_only]($read_only_style) "
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
style = "blue"
before_repo_root_style = "muted"
repo_root_style = "bold blue"
read_only = " ro"
read_only_style = "red"
truncation_length = 4
truncate_to_repo = true
fish_style_pwd_dir_length = 1

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "purple"

[git_commit]                     # short hash / tag when HEAD is detached
format = "[$hash$tag]($style) "
style = "subtle"
tag_disabled = false
tag_symbol = " tag:"

[git_state]                      # REBASING 2/5, MERGING, ...
format = '[$state( $progress_current/$progress_total)]($style) '
style = "bold orange"

[git_status]                     # +staged !modified ✘deleted »renamed ?untracked =conflict *stash ⇡ahead ⇣behind
format = '($conflicted$staged$modified$deleted$renamed$untracked$stashed$ahead_behind)'
conflicted = "[=$count](bold red) "
staged = "[+$count](green) "
modified = "[!$count](yellow) "
deleted = "[✘$count](red) "
renamed = "[»$count](cyan) "
untracked = "[?$count](blue) "
stashed = "[*$count](muted) "
ahead = "[⇡$count](cyan) "
behind = "[⇣$count](cyan) "
diverged = "[⇡$ahead_count⇣$behind_count](cyan) "

[fill]
symbol = " "

# --- Right -----------------------------------------------------------------
[status]                         # exit code of the last command, only when it failed
disabled = false
format = "[$symbol$status]($style)  "
symbol = "✘ "
style = "red"

[cmd_duration]
min_time = 2000
format = "[$duration]($style)  "
style = "yellow"

[jobs]
format = "[$symbol$number]($style)  "
symbol = "&"
style = "subtle"

[nodejs]
format = "[$symbol$version]($style)  "
symbol = "\U000F0399 "
version_format = "${major}.${minor}"
style = "subtle"

[python]
format = '[$symbol$version( $virtualenv)]($style)  '
symbol = "\U000F0320 "
version_format = "${major}.${minor}"
style = "subtle"

[rust]
format = "[$symbol$version]($style)  "
symbol = "\U000F1617 "
version_format = "${major}.${minor}"
style = "subtle"

[golang]
format = "[$symbol$version]($style)  "
symbol = "\U000F07D3 "
version_format = "${major}.${minor}"
style = "subtle"

[docker_context]
format = "[$symbol$context]($style)  "
symbol = "\U000F0868 "
style = "subtle"

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "muted"

# --- Prompt character ------------------------------------------------------
[character]
success_symbol = "[>](bold purple)"
error_symbol = "[>](bold red)"
vimcmd_symbol = "[<](bold green)"
