# Prefix: Ctrl-a (instead of Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
setw -g mode-keys vi

# Splits open in the current directory: prefix | and prefix -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with prefix h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# prefix r reloads this file
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Status bar (Tokyo Night, plain text)
set -g status-position top
set -g status-style "bg=default,fg=#565f89"
set -g status-left-length 30
set -g status-left "#[fg=#7aa2f7,bold]#S  "
set -g status-right "#{?client_prefix,#[fg=#e0af68]prefix  ,}#[fg=#565f89]#h  %a %d %b  %H:%M"
setw -g window-status-separator "  "
setw -g window-status-format "#I #W"
setw -g window-status-current-format "#[fg=#c0caf5,bold]#I #W"
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#565f89"
set -g message-style "bg=default,fg=#e0af68"
