        run: make "$PART-build"

  release-linux-amd64:
    if: ${{ inputs.run_release && !failure() && !cancelled() }}
    needs: [check, build]
    runs-on: ${{ vars.STD_RUNNER || 'ubuntu-24.04' }}
    container: rust:1.99.1-bookworm
    permissions:
      contents: write
    env:
      PART: ${{ inputs.part }}
      PART_DIR: ${{ inputs.part_dir }}
      STD_APT_PACKAGES: ${{ vars.STD_APT_PACKAGES }}
      PLATFORM: linux-amd64
    steps:
      - name: Get the GitHub CLI (release.sh needs it; a container has none)
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then exit 0; fi
          if ! command -v curl >/dev/null 2>&1; then s=""; [ "$(id -u)" = 0 ] || s=sudo; $s apt-get update -qq && $s apt-get install -y -qq --no-install-recommends curl ca-certificates; fi
          ver=2.103.3
          case "$(uname -m)" in
            x86_64) arch=amd64; sha=4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d ;;
            aarch64) arch=arm64; sha=ee32df2323c8847f5fac6cb6b4b69ca75828e9329a8f22f677021f7b3306ce63 ;;
            *) echo "gh: unsupported architecture $(uname -m)" >&2; exit 1 ;;
          esac
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/gh.tgz" "https://github.com/cli/cli/releases/download/v${ver}/gh_${ver}_linux_${arch}.tar.gz"
          echo "$sha  $tmp/gh.tgz" | sha256sum -c -
          tar -xzf "$tmp/gh.tgz" -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$tmp/gh_${ver}_linux_${arch}/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
