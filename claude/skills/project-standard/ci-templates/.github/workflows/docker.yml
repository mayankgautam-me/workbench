# project-standard ci-templates v1.6: docker (an image built with buildx and pushed to ghcr.io with GITHUB_TOKEN).
# Called by a project's .github/workflows/checks.yml and release.yml as uses: mayankgautam-me/ci-templates/.github/workflows/docker.yml@v1.6.

on:
  workflow_call:
    inputs:
      part: { type: string, required: true }
      part_dir: { type: string, required: true }
      run_check: { type: boolean, default: true }
      run_build: { type: boolean, default: true }
      run_release: { type: boolean, default: false }
      confirm: { type: string, default: '' }
      deploy_staging: { type: boolean, default: false }
    secrets:
      SECRETS_DEPLOY_KEY:
        required: false
      SOPS_AGE_KEY:
        required: false
      KICAD_LIBRARY_DEPLOY_KEY:
        required: false

jobs:
  check:
    if: ${{ inputs.run_check }}
    runs-on: ${{ vars.STD_RUNNER || 'ubuntu-24.04' }}
    env:
      PART: ${{ inputs.part }}
      PART_DIR: ${{ inputs.part_dir }}
      STD_APT_PACKAGES: ${{ vars.STD_APT_PACKAGES }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the Git LFS objects of this part
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ inputs.part }}-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            lfs-${{ inputs.part }}-
      - name: Get the Git LFS files of this part only
        shell: bash
        env:
          PART_DIR: ${{ inputs.part_dir }}
        run: |
          set -euo pipefail
          if ! command -v git-lfs >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""
            [ "$(id -u)" = 0 ] || sudo_cmd=sudo
            $sudo_cmd apt-get update -qq
            $sudo_cmd apt-get install -y -qq git-lfs
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git lfs pull --include "$PART_DIR/**"
      - name: Install mise and the project's tools
        shell: bash
        run: |
          set -euo pipefail
          # Explicit setup, carried over from the v8 .std-mise helper. Linux: make, git, curl and jq from apt when one is missing,
          # and STD_APT_PACKAGES. mise comes from its pinned release tarball, sha256 checked (not curl | sh). Change the
          # version and all four digests together.
          if [ "$(uname -s)" = Linux ] && command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""; [ "$(id -u)" = 0 ] || sudo_cmd=sudo
            need=""; for t in make git curl jq; do command -v "$t" >/dev/null 2>&1 || need="$need $t"; done
            if [ -n "$need" ] || { [ -n "${STD_APT_PACKAGES:-}" ] && ! dpkg -s ${STD_APT_PACKAGES:-} >/dev/null 2>&1; }; then
              $sudo_cmd apt-get update -qq
              $sudo_cmd apt-get install -y -qq --no-upgrade $need ca-certificates ${STD_APT_PACKAGES:-}
            fi
          fi
          if ! command -v mise >/dev/null 2>&1; then
            mise_v=v2026.11.3
            case "$(uname -s)-$(uname -m)" in
              Linux-x86_64) mise_os=linux-x64; mise_sha=837acae6defb8c9ad74823f6e38856633bacb04c65c1ac67d952749847543bd9; sha_cmd="sha256sum" ;;
              Linux-aarch64) mise_os=linux-arm64; mise_sha=13547a80d1dc2d5f81bb183023732f4981486e894d060e30993cc4364b4af51d; sha_cmd="sha256sum" ;;
              Darwin-arm64) mise_os=macos-arm64; mise_sha=de9a54330fee4edede51a3cf6196bbf522f01c5e3fd981e0bebea33f561a0431; sha_cmd="shasum -a 256" ;;
              Darwin-x86_64) mise_os=macos-x64; mise_sha=88389a4a624a7279ec8d2d06e5c0fbd874ce4f5de791767883b32f62f4e1d62c; sha_cmd="shasum -a 256" ;;
              *) echo "mise: unsupported platform $(uname -s)-$(uname -m)" >&2; exit 1 ;;
            esac
            mise_d="$(mktemp -d)"
            curl -fsSL -o "$mise_d/mise.tar.gz" "https://github.com/jdx/mise/releases/download/$mise_v/mise-$mise_v-$mise_os.tar.gz"
            echo "$mise_sha  $mise_d/mise.tar.gz" | $sha_cmd -c -
            tar -xzf "$mise_d/mise.tar.gz" -C "$mise_d" mise/bin/mise
            mkdir -p "$HOME/.local/bin"
            install -m 755 "$mise_d/mise/bin/mise" "$HOME/.local/bin/mise"
            rm -rf "$mise_d"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          mise install
      - name: Install dependencies (no CI key)
        run: env -u SOPS_AGE_KEY make "$PART-setup"
      - name: Check
        run: make "$PART-check"

  build:
    if: ${{ inputs.run_build && !failure() && !cancelled() }}
    needs: check
    runs-on: ${{ vars.STD_RUNNER || 'ubuntu-24.04' }}
    env:
      PART: ${{ inputs.part }}
      PART_DIR: ${{ inputs.part_dir }}
      STD_APT_PACKAGES: ${{ vars.STD_APT_PACKAGES }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep the Git LFS objects of this part
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: lfs-${{ inputs.part }}-${{ hashFiles('.gitattributes') }}
          restore-keys: |
            lfs-${{ inputs.part }}-
      - name: Get the Git LFS files of this part only
        shell: bash
        env:
          PART_DIR: ${{ inputs.part_dir }}
        run: |
          set -euo pipefail
          if ! command -v git-lfs >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""
            [ "$(id -u)" = 0 ] || sudo_cmd=sudo
            $sudo_cmd apt-get update -qq
            $sudo_cmd apt-get install -y -qq git-lfs
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git lfs pull --include "$PART_DIR/**"
      - name: Install mise and the project's tools
        shell: bash
        run: |
          set -euo pipefail
          # Explicit setup, carried over from the v8 .std-mise helper. Linux: make, git, curl and jq from apt when one is missing,
          # and STD_APT_PACKAGES. mise comes from its pinned release tarball, sha256 checked (not curl | sh). Change the
          # version and all four digests together.
          if [ "$(uname -s)" = Linux ] && command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""; [ "$(id -u)" = 0 ] || sudo_cmd=sudo
            need=""; for t in make git curl jq; do command -v "$t" >/dev/null 2>&1 || need="$need $t"; done
            if [ -n "$need" ] || { [ -n "${STD_APT_PACKAGES:-}" ] && ! dpkg -s ${STD_APT_PACKAGES:-} >/dev/null 2>&1; }; then
              $sudo_cmd apt-get update -qq
              $sudo_cmd apt-get install -y -qq --no-upgrade $need ca-certificates ${STD_APT_PACKAGES:-}
            fi
          fi
          if ! command -v mise >/dev/null 2>&1; then
            mise_v=v2026.11.3
            case "$(uname -s)-$(uname -m)" in
              Linux-x86_64) mise_os=linux-x64; mise_sha=837acae6defb8c9ad74823f6e38856633bacb04c65c1ac67d952749847543bd9; sha_cmd="sha256sum" ;;
              Linux-aarch64) mise_os=linux-arm64; mise_sha=13547a80d1dc2d5f81bb183023732f4981486e894d060e30993cc4364b4af51d; sha_cmd="sha256sum" ;;
              Darwin-arm64) mise_os=macos-arm64; mise_sha=de9a54330fee4edede51a3cf6196bbf522f01c5e3fd981e0bebea33f561a0431; sha_cmd="shasum -a 256" ;;
              Darwin-x86_64) mise_os=macos-x64; mise_sha=88389a4a624a7279ec8d2d06e5c0fbd874ce4f5de791767883b32f62f4e1d62c; sha_cmd="shasum -a 256" ;;
              *) echo "mise: unsupported platform $(uname -s)-$(uname -m)" >&2; exit 1 ;;
            esac
            mise_d="$(mktemp -d)"
            curl -fsSL -o "$mise_d/mise.tar.gz" "https://github.com/jdx/mise/releases/download/$mise_v/mise-$mise_v-$mise_os.tar.gz"
            echo "$mise_sha  $mise_d/mise.tar.gz" | $sha_cmd -c -
            tar -xzf "$mise_d/mise.tar.gz" -C "$mise_d" mise/bin/mise
            mkdir -p "$HOME/.local/bin"
            install -m 755 "$mise_d/mise/bin/mise" "$HOME/.local/bin/mise"
            rm -rf "$mise_d"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          mise install
      - name: Install dependencies (no CI key)
        run: env -u SOPS_AGE_KEY make "$PART-setup"
      - name: Build (no push)
        run: make "$PART-build"

  deploy-staging:
    if: ${{ inputs.deploy_staging && !failure() && !cancelled() }}
    needs: [check, build]
    runs-on: ${{ vars.STD_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      packages: write
    env:
      PART: ${{ inputs.part }}
      PART_DIR: ${{ inputs.part_dir }}
      STD_APT_PACKAGES: ${{ vars.STD_APT_PACKAGES }}
      DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - name: Export the workspace paths (in a container, github.workspace is the host path)
        shell: bash
        run: |
          echo "SECRETS_DIR=$GITHUB_WORKSPACE/.ci/secrets" >> "$GITHUB_ENV"
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the secrets repo (sparse, for decryption)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ vars.SECRETS_REPO }}
          ssh-key: ${{ secrets.SECRETS_DEPLOY_KEY }}
          path: .ci/secrets
          sparse-checkout: |
            /${{ github.event.repository.name }}/
            /recipients/
          sparse-checkout-cone-mode: false
      - name: Install mise and the project's tools
        shell: bash
        run: |
          set -euo pipefail
          # Explicit setup, carried over from the v8 .std-mise helper. Linux: make, git, curl and jq from apt when one is missing,
          # and STD_APT_PACKAGES. mise comes from its pinned release tarball, sha256 checked (not curl | sh). Change the
          # version and all four digests together.
          if [ "$(uname -s)" = Linux ] && command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""; [ "$(id -u)" = 0 ] || sudo_cmd=sudo
            need=""; for t in make git curl jq; do command -v "$t" >/dev/null 2>&1 || need="$need $t"; done
            if [ -n "$need" ] || { [ -n "${STD_APT_PACKAGES:-}" ] && ! dpkg -s ${STD_APT_PACKAGES:-} >/dev/null 2>&1; }; then
