          path: .git/lfs
          key: ${{ steps.lfs-key.outputs.key }}
          restore-keys: |
            lfs-${{ inputs.part }}-
      - name: Get the Git LFS files of this part only
        shell: bash
        env:
          PART_DIR: ${{ inputs.part_dir }}
        run: |
          set -euo pipefail
