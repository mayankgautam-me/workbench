            fi
            channel=main
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: ${{ steps.flutter-version.outputs.channel }}
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          cache: true
      - name: Get the Git LFS cache key before anything builds
        id: lfs-key
        shell: bash
        env:
          KEY: lfs-${{ inputs.part }}-${{ hashFiles('.gitattributes') }}
        run: echo "key=$KEY" >> "$GITHUB_OUTPUT"
      - name: Keep the Git LFS objects of this part
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .git/lfs
          key: ${{ steps.lfs-key.outputs.key }}
          restore-keys: |
            lfs-${{ inputs.part }}-
      - name: Get the Git LFS files of this part only
        shell: bash
        env:
          PART_DIR: ${{ inputs.part_dir }}
        run: |
          set -euo pipefail
          if ! command -v git-lfs >/dev/null 2>&1 && command -v apt-get >/dev/null 2>&1; then
            sudo_cmd=""
            [ "$(id -u)" = 0 ] || sudo_cmd=sudo
            $sudo_cmd apt-get update -qq
            $sudo_cmd apt-get install -y -qq git-lfs
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git lfs install --local
          git lfs pull --include "$PART_DIR/**"
      - name: Install system packages (apt)
        run: |
          s=""; [ "$(id -u)" = 0 ] || s=sudo
          $s apt-get update -qq
          $s apt-get install -y -qq --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev jq ${STD_APT_PACKAGES:-}
